name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:smoke
      - run: python -m py_compile connectors/mt5-bridge/bridge.py connectors/mt5-bridge/test-all-forex.py connectors/profit-bridge/bridge.py
      - run: npm run build
